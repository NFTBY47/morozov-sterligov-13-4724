name: lab02
on:
  push:
    paths: ['labs/lab02/**', 'check.py', 'requirements.txt', '.github/workflows/lab02.yml']
  pull_request:
    paths: ['labs/lab02/**', 'check.py', 'requirements.txt', '.github/workflows/lab02.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  required-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python check.py lab02
